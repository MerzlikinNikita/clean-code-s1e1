<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section class="section add-task">
        <h1 class="section__title title">Add Item</h1>
        <div class="add-task__wrapper">
          <input id="new-task" class="add-task__input" type="text">
          <button class="tasks__btn">Add</button>
        </div>
      </section>
      <section class="section">
        <h2 class="section__title">Todo</h2>
        <ul class="tasks__list" id="incomplete-tasks">
          <li class="tasks__item">
            <input class="tasks__input" type="checkbox">
            <label class="tasks__text task">Pay Bills</label>
            <input type="text" class="tasks__input task">
            <button class="tasks__btn edit">Edit</button>
            <button class="tasks__btn delete">
              <img class="tasks__img-remove" src="./remove.svg" alt="remove icon">
            </button>
          </li>
          <li class="tasks__item edit-mode">
            <input class="tasks__input" type="checkbox">
            <label class="tasks__text task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="tasks__input task">
            <button class="tasks__btn edit">Save</button>
            <button class="tasks__btn delete">
              <img class="tasks__img-remove" src="./remove.svg" alt="remove icon">
            </button>
          </li>
        </ul>
      </section>
      <section class="section">
        <h2 class="section__title">Completed</h2>
        <ul class="tasks__list" id="completed-tasks">
          <li class="tasks__item">
            <input class="tasks__input" type="checkbox" checked>
            <label class="tasks__text task">See the Doctor</label>
            <input type="text" class="tasks__input task">
            <button class="tasks__btn edit">Edit</button>
            <button class="tasks__btn delete">
              <img class="tasks__img-remove" src="./remove.svg" alt="remove icon">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
