<!DOCTYPE html>
<html>
<HEAD>
<title>Todo App</title>
<link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet'>
<link rel="stylesheet" href="style.css" MEDIA="screen" charset="utf-8">
</HEAD>
<body class="page">
<div class="header">
<img class="matrix" src="./eisenhower-matrix.jpg">
<a class='info' href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
</div>
<div class="main">
<p id='new-tasks'>
<label class="label" for="new-task">Add Item</label>
<div class="task-wrapper">
<input id='new-task'class="input task" type="text">
<button class="button">Add</button>
</div>
</p>
<h3 class="sub-header">Todo</h3>
<ul class="list" id='incomplete-tasks'>
<li class="list-item">
<input class="input" type='checkbox'>
<label class="label task">Pay Bills</label>
<input type="text" class="input task">
<button class="button edit">Edit</button>
<button class="button delete">
<img class="img-remove" src="./remove.svg">
</button>
</li>
<li class="list-item edit-mode">
<input class="input" type="checkbox">
<label class="label task">Go Shopping</label>
<input type="text" value="Go Shopping" class="input task">
<button class='button edit'>Save</button>
<button class="button delete">
<img class="img-remove" src="./remove.svg">
</button>
</li>
</ul>
<h3 class="sub-header">Completed</h3>
<ul class="list" id="completed-tasks">
<li class="list-item">
<input class="input" type="checkbox" checked>
<label class="label task">See the Doctor</label>
<input type="text" class="input task">
<button class="button edit">Edit</button>
<button class="button delete">
<img class="img-remove" src="./remove.svg">
</button>
</li>
</ul>
</div>
<script SRC="app.js"></script>
</body>
</html>
